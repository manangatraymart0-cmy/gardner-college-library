<!DOCTYPE html>
<html>

<head>

    <title>GARDNER COLLEGE LIBRARY - Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2742, #1f4e79, #102a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ANIMATED LIBRARY BACKGROUND */

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            animation: float1 8s infinite ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 10s infinite ease-in-out;
        }

        @keyframes float1 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(60px, 40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }

        @keyframes float2 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-50px, -40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        /* FLOATING BOOK SHAPES */

        .register-box::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 90px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            left: -250px;
            top: 100px;
            transform: rotate(-15deg);
            animation: book1 6s infinite ease-in-out;
        }

        .register-box::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 85px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            right: -240px;
            bottom: 80px;
            transform: rotate(15deg);
            animation: book2 7s infinite ease-in-out;
        }

        @keyframes book1 {

            0% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(-35px) rotate(-5deg);
            }

            100% {
                transform: translateY(0) rotate(-15deg);
            }

        }

        @keyframes book2 {

            0% {
                transform: translateY(0) rotate(15deg);
            }

            50% {
                transform: translateY(30px) rotate(25deg);
            }

            100% {
                transform: translateY(0) rotate(15deg);
            }

        }


        .register-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1f4e79;
            color: white;
            border-radius: 10px;
            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }

        h1 {
            color: #1f4e79;
            font-size: 23px;
            margin-top: 15px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #243b53;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #d5d9de;
            border-radius: 6px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1f4e79;
        }

        button {
            width: 100%;
            padding: 13px;

            margin-top: 22px;

            border: none;
            border-radius: 6px;

            background: #1f4e79;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .back a {
            color: #1f4e79;
            font-weight: bold;
            text-decoration: none;
        }

.register-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

.register-text a {
    color: #1f4e79;
    font-weight: bold;
    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}










    </style>

</head>


<body>

    <div class="register-box">

        <div class="header">

            <div class="logo">
                GCD
            </div>

            <h1>Create Student Account</h1>

            <p class="subtitle">
                Gardner College Library
            </p>

        </div>


        <form onsubmit="register(); return false;">

            <label>Full Name</label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >


            <label>Student ID</label>

            <input
                type="text"
                id="studentid"
                placeholder="Enter your student ID"
                required
            >


            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Create a username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirm"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="back">

            Already have an account?

            <a href="index.html">
                Sign In
            </a>

        </div>

    </div>


    <script>

        function register() {

            var fullname =
                document.getElementById("fullname").value;

            var studentid =
                document.getElementById("studentid").value;

            var username =
                document.getElementById("username").value;

            var password =
                document.getElementById("password").value;

            var confirm =
                document.getElementById("confirm").value;


            /* Check passwords */

            if (password != confirm) {

                alert("Passwords do not match!");

                return;

            }


            /* Check if username already exists */

            var existingUser =
                localStorage.getItem("user_" + username);


            if (existingUser != null) {

                alert("Username already exists!");

                return;

            }


            /* Create account */

            var account = {

                fullname: fullname,
                studentid: studentid,
                username: username,
                password: password,
                role: "student"

            };


            localStorage.setItem(
                "user_" + username,
                JSON.stringify(account)
            );


            alert("Account created successfully!");


            window.location.href = "index.html";

        }

    </script>

</body>

</html>
