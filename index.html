<!DOCTYPE html>
<html>

<head>

    <title>GARDNER COLLEGE LIBRARY- Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2742, #1f4e79, #102a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ANIMATED LIBRARY BACKGROUND */

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            animation: float1 8s infinite ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 10s infinite ease-in-out;
        }

        @keyframes float1 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(60px, 40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }

        @keyframes float2 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-50px, -40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        /* FLOATING BOOK SHAPES */

        .login-box::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 90px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            left: -250px;
            top: 100px;
            transform: rotate(-15deg);
            animation: book1 6s infinite ease-in-out;
        }

        .login-box::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 85px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            right: -240px;
            bottom: 80px;
            transform: rotate(15deg);
            animation: book2 7s infinite ease-in-out;
        }

        @keyframes book1 {

            0% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(-35px) rotate(-5deg);
            }

            100% {
                transform: translateY(0) rotate(-15deg);
            }

        }

        @keyframes book2 {

            0% {
                transform: translateY(0) rotate(15deg);
            }

            50% {
                transform: translateY(30px) rotate(25deg);
            }

            100% {
                transform: translateY(0) rotate(15deg);
            }

        }


        .login-box {
            width: 400px;
            background: rgba(255,255,255,0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.30);
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1f4e79;
            color: white;
            border-radius: 10px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(31,78,121,0.3);
        }

        .header h1 {
            margin-top: 15px;
            color: #1f4e79;
            font-size: 24px;
        }

        .header p {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #243b53;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9de;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #163a5c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(31,78,121,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

.register-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

.register-text a {
    color: #1f4e79;
    font-weight: bold;
    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 44px;
}

.toggle-password {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);

    width: auto;
    margin: 0;
    padding: 6px 8px;

    background: none;
    border: none;
    box-shadow: none;

    font-size: 17px;
    line-height: 1;
    color: #8a97a6;
    cursor: pointer;
}

.toggle-password:hover {
    background: none;
    color: #1f4e79;
    transform: translateY(-50%);
    box-shadow: none;
}

.toggle-password svg {
    display: block;
}

.forgot-row {
    text-align: right;
    margin-top: 8px;
}

.forgot-row a {
    font-size: 12px;
    color: #1f4e79;
    font-weight: bold;
    text-decoration: none;
}

.forgot-row a:hover {
    text-decoration: underline;
}

.reset-subtitle {
    color: #777;
    font-size: 13px;
    margin: -8px 0 4px;
}
    </style>

   


</head>


<body>


    <div class="login-box">

        <div class="header">

            <div class="logo">GCD</div>

            <h1>GARDNER COLLEGE LIBRARY</h1>

            <p>Web-Based Book Borrowing System</p>

        </div>


        <!-- LOGIN VIEW -->
        <div id="loginView">

            <form onsubmit="login(); return false;">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label>Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                    >
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>

                </div>

                <div class="forgot-row">
                    <a href="#" onclick="showReset(); return false;">
                        Forgot your password?
                    </a>
                </div>


                <button type="submit">
                    Login
                </button>

                <p class="register-text">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </form>

        </div>


        <!-- FORGOT PASSWORD / RESET VIEW -->
        <div id="resetView" style="display: none;">

            <p class="reset-subtitle">
                Enter your username and student ID to verify your
                identity, then set a new password.
            </p>

            <form onsubmit="resetPassword(); return false;">

                <label>Username</label>

                <input
                    type="text"
                    id="resetUsername"
                    placeholder="Enter your username"
                    required
                >


                <label>Student ID</label>

                <input
                    type="text"
                    id="resetStudentId"
                    placeholder="Enter your student ID"
                    required
                >


                <label>New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create a new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)"
                    >
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>

                </div>


                <label>Confirm New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm your new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmNewPassword', this)"
                    >
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>

                </div>


                <button type="submit">
                    Reset Password
                </button>

                <p class="register-text">
                    Remembered your password?
                    <a href="#" onclick="showLogin(); return false;">Back to Sign In</a>
                </p>

            </form>

        </div>


        <div class="footer">
            GARDNER COLLEGE LIBRARY
        </div>

    </div>


    <script>

        /* SHOW / HIDE PASSWORD */

        var eyeOpenIcon =
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

        var eyeOffIcon =
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';


        function togglePassword(inputId, button) {

            var input =
                document.getElementById(inputId);


            if (input.type === "password") {

                input.type = "text";
                button.innerHTML = eyeOffIcon;

            }

            else {

                input.type = "password";
                button.innerHTML = eyeOpenIcon;

            }

        }


        /* SWITCH BETWEEN LOGIN AND FORGOT-PASSWORD VIEWS */

        function showReset() {

            document.getElementById("loginView").style.display = "none";
            document.getElementById("resetView").style.display = "block";

        }

        function showLogin() {

            document.getElementById("resetView").style.display = "none";
            document.getElementById("loginView").style.display = "block";

        }


        /* RESET PASSWORD */

        function resetPassword() {

            var username =
                document.getElementById("resetUsername").value;

            var studentid =
                document.getElementById("resetStudentId").value;

            var newPassword =
                document.getElementById("newPassword").value;

            var confirmNewPassword =
                document.getElementById("confirmNewPassword").value;


            if (newPassword != confirmNewPassword) {

                alert("New passwords do not match!");

                return;

            }


            var savedAccount =
                localStorage.getItem("user_" + username);


            if (savedAccount == null) {

                alert("No account found with that username.");

                return;

            }


            var account =
                JSON.parse(savedAccount);


            if (account.studentid != studentid) {

                alert("Student ID does not match our records.");

                return;

            }


            account.password = newPassword;

            localStorage.setItem(
                "user_" + username,
                JSON.stringify(account)
            );


            alert("Password reset successfully! You can now sign in.");

            showLogin();

        }


        function login() {

    var username =
        document.getElementById("username").value;

    var password =
        document.getElementById("password").value;


    /* Check registered student account */

    var savedAccount =
        localStorage.getItem("user_" + username);


    if (savedAccount != null) {

        var account =
            JSON.parse(savedAccount);


        if (account.password == password) {

            /* Accounts created before roles existed default to student */

            if (!account.role) {

                account.role = "student";

            }

            localStorage.setItem(
                "loggedInUser",
                JSON.stringify(account)
            );

            window.location.href = "dashboard.html";

        }

        else {

            alert("Incorrect password!");

        }

        return;

    }


    /* Administrator account */

    if (username == "admin" && password == "12345") {

        localStorage.setItem(
            "loggedInUser",
            JSON.stringify({
                fullname: "Administrator",
                username: "admin",
                role: "admin"
            })
        );

        window.location.href = "dashboard.html";

    }

    else {

        alert("Username or password is incorrect!");

    }

}
    </script>

</body>

</html>
